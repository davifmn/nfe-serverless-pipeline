name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python }} (lint + tests)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -v

  terraform:
    name: Terraform (fmt, validate, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.17"
      - run: terraform fmt -check -recursive -diff infra
      - name: Pipeline stack
        working-directory: infra
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test
      - name: Bootstrap stack
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

  lint-and-scan:
    name: tflint + Trivy misconfiguration scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
      - name: tflint
        working-directory: infra
        run: |
          tflint --init
          tflint --recursive --config "$PWD/.tflint.hcl" --format compact
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Trivy (fails on HIGH/CRITICAL findings)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: "1"
