[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfe-serverless-pipeline"
version = "1.0.0"
description = "Event-driven NF-e ingestion on AWS: S3, SQS, Lambda, DynamoDB, API Gateway, EventBridge"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Davi Fraga" }]
# Runtime code uses only the standard library and boto3 (bundled in the Lambda runtime),
# so the deployment package is just the source tree.
dependencies = []

[project.optional-dependencies]
dev = ["boto3>=1.35", "moto[s3,sqs,dynamodb,events]>=5", "pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"scripts/*" = ["S", "E501"]
